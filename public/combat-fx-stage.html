  </svg><section id="viewBattle" data-hud-phase="ENEMY_ACTIONS" class="view-panel view-battle active">
        <div class="battle-layout">
          <!-- 左側即時戰鬥紀事 (Live Battle Chronicle) -->
          

          <!-- 右側中央主戰場 (Main Arena) -->
          <div class="battle-main">
            <!-- 上方：怪物與戰場舞台 (Enemies Stage) -->
            <div class="monster-card battle-arena" id="monsterCard">
              <div class="arena-granules"></div>
              <div class="arena-top">
                <span class="eyebrow" id="battleEncounterTitle">ENCOUNTER / THE FORGOTTEN HALL</span>
                <div class="round-count" id="battleTimerWrap">
                  <svg class="ico sm"><use href="#icon-timer"/></svg>
                  第 <b id="battleFloorNum">1</b> 層 · 回合 <b id="battleRoundNum">1</b>
                  <span class="soft-tag"><span id="battleTimerCount">30</span>s 倒數</span>
                </div>
              </div>

              <!-- 神魔之塔風格敵方戰場編隊排佈舞台 -->
              <div id="battleEnemiesStage" class="battle-enemies-stage enemies"></div>
            </div>

            <!-- 戰況交鋒即時特寫廣播面板 (若觸發) -->
            <div id="battleNarrativeBox" class="card battle-narrative-card glass-panel hidden">
              <div class="narrative-header">
                <span class="narrative-tag"><svg class="ico sm"><use href="#icon-sword"/></svg> 戰況交鋒即時特寫</span>
                <span class="narrative-status-note"><svg class="ico sm"><use href="#icon-log"/></svg> 戰況敘述進行中，行動準備中...</span>
              </div>
              <div id="battleNarrativeText" class="battle-narrative-text"></div>
            </div>

            <!-- 中間：隊友全員即時狀態欄 (Party Strip) -->
            <div class="teammates-card party-strip-container">
              <div class="party-strip-topline">
                <div class="section-topline-mini">
                  <span id="shieldNoticeBadge" class="soft-tag badge-amber hidden"><svg class="ico sm"><use href="#icon-shield"/></svg> 壁壘守護生效</span>
                </div>
              </div>
              <div id="battleTeammatesGrid" class="teammates-grid party-strip" tabindex="0" aria-label="我方隊伍；多人時可橫向捲動">
                <!-- 動態隊友卡片 -->
              </div>
            </div>

            <!-- 下方：蒼藍遺跡指令台 (Azure Command Dock) -->
            <div class="player-action-card command-panel" id="playerActionCard">
              <div class="command-top">
                <h2>指令選擇 <span>SELECT ACTION</span></h2>
                <div class="command-player-tags">
                  <span id="myActionStatus" class="action-status-badge">請指定本回合行動</span>
                </div>
              </div>

              <!-- 專屬技能按鈕列 -->
              <div id="mySkillsRow" class="skills-row skill-grid">
                <!-- 動態技能按鈕 -->
              </div>

              <!-- 技能鎖定與確認操作列 (SELECTING -> SELECTED -> CONFIRM -> LOCKED -> ALL PLAYERS LOCKED) -->
              <div id="skillSelectionBar" class="skill-selection-bar command-details">
                <div class="selection-summary-left selected-skill-info">
                  <div class="selected-skill-title">
                    <span class="ornament-diamond"></span>
                    <span id="selectionPromptText" class="selection-prompt-text">請點選上方技能進行選擇</span>
                    <span id="selectionTargetText" class="selection-target-text hidden"></span>
                  </div>
                  <div class="selected-skill-desc" id="skillDetailDesc">請點選上方技能卡片，檢視技能效果並下達行動指令。</div>
                </div>
                <div class="selection-action-buttons">
                  <button id="btnUseLeaderSkill" class="btn btn-leader-skill hidden" type="button">
                    <svg class="ico sm"><use href="#icon-crown"/></svg> 隊長技
                  </button>
                  <button id="btnConfirmLock" class="btn btn-primary btn-lock btn gold confirm-action" disabled>
                    <svg class="ico sm"><use href="#icon-check"/></svg> 確定鎖定 (CONFIRM)
                  </button>
                  <button id="btnUnlockAction" class="btn btn-secondary btn-unlock btn ghost small hidden">
                    <svg class="ico sm"><use href="#icon-unlock"/></svg> 取消鎖定 (UNLOCK)
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <section id="hudPlayerInfo" class="battle-hud-player" aria-label="我的角色狀態">
          <button id="hudPlayerAvatar" type="button" aria-label="查看角色詳細資訊"></button>
          <div class="hud-player-copy"><small id="hudPlayerRole"></small><strong id="hudPlayerName"></strong>
            <div class="hud-player-hp"><i id="hudPlayerHpFill"></i></div><span id="hudPlayerHpText"></span>
            <p id="hudPlayerResource"></p><div id="hudPlayerStatuses" class="combat-status-list"></div>
          </div>
        </section>
        <section id="sageEquationTerminal" class="sage-equation-terminal" hidden>
          <details><summary><strong id="sageTerminalPhase">∑ 假設階段</strong><span id="sageTerminalSummary"></span><small>展開演算 / EQUATION TERMINAL</small></summary>
            <div id="sageTerminalDetails"></div>
          </details>
        </section>
        <div id="hudActionQueue" class="battle-hud-queue" aria-label="伺服器行動順序"></div>
        <div id="hudPhaseNotice" class="battle-hud-notice" aria-live="polite"></div>
        <div id="cinematicSkillBanner" class="cinematic-skill-banner" aria-live="polite">
          <small><span id="cinematicActorName"></span> · <span id="cinematicActorRole"></span></small>
          <strong id="cinematicSkillName"></strong><span>SKILL ACTIVATED</span>
        </div>
      </section><div id="presentationRoot" class="presentation-root"></div><div id="floatingEnemyTooltip" class="floating-status-tooltip" role="tooltip" aria-hidden="true"></div><div id="battleSkillTooltip" class="battle-skill-tooltip" aria-hidden="true"></div><dialog id="labMinions"><form method="dialog"><button>關閉</button></form><div></div></dialog>
