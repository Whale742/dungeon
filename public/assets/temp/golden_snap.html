<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Golden Snap - Interactive Animation</title>
  <style>
    :root {
      --gold: #edc86f;
      --cream: #eee8d9;
      --muted: #82857f;
      --line: rgba(224, 199, 138, .13);
      --bg: #090b0c;
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--cream);
      background: var(--bg)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: radial-gradient(ellipse at 50% 0%, #1c201e 0, transparent 55%), #090b0c
    }

    button,
    input {
      font: inherit
    }

    button {
      color: inherit;
      cursor: pointer
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 5px
    }

    button {
      touch-action: manipulation
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .app {
      width: min(1320px, calc(100% - 88px));
      margin: 0 auto;
      padding: 40px 0 26px
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      gap: 20px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .brand-mark {
      width: 43px;
      height: 43px;
      flex: none;
      color: var(--gold)
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .25em;
      color: #af9566;
      margin: 0 0 8px
    }

    .title {
      font-size: 24px;
      line-height: 1.3;
      letter-spacing: .13em;
      margin: 0;
      font-weight: 500
    }

    .masthead-note {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #9b9e97;
      letter-spacing: .08em;
      font-size: 11px
    }

    .status-light {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px #e3bb5e60
    }

    .stage-shell {
      border: 1px solid var(--line);
      background: #07090a;
      box-shadow: 0 25px 90px #0005;
      position: relative;
      overflow: hidden;
      border-radius: 5px
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      isolation: isolate;
      background: radial-gradient(ellipse at 50% 43%, #181d1c 0, #0b1012 41%, #06090c 81%)
    }

    .stage:fullscreen {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      border: 0
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .environment {
      z-index: 0
    }

    .backfx {
      z-index: 2
    }

    .frontfx {
      z-index: 5
    }

    .floor-glow {
      position: absolute;
      left: 20%;
      right: 20%;
      height: 8%;
      bottom: 10%;
      background: radial-gradient(ellipse, #bf934513, transparent 70%);
      filter: blur(22px);
      z-index: 1
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 110px 26px #0204057a;
      pointer-events: none;
      z-index: 7
    }

    .frame-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #d5b15c55;
      border-style: solid;
      z-index: 8;
      opacity: .65
    }

    .tl {
      left: 21px;
      top: 21px;
      border-width: 1px 0 0 1px
    }

    .tr {
      right: 21px;
      top: 21px;
      border-width: 1px 1px 0 0
    }

    .bl {
      left: 21px;
      bottom: 21px;
      border-width: 0 0 1px 1px
    }

    .br {
      right: 21px;
      bottom: 21px;
      border-width: 0 1px 1px 0
    }

    .scene-meta {
      position: absolute;
      z-index: 8;
      top: 31px;
      left: 39px;
      pointer-events: none
    }

    .scene-overline {
      font: 9px/1.3 ui-monospace, Consolas, monospace;
      letter-spacing: .22em;
      color: #a28c604d
    }

    .scene-phase {
      font-size: 12px;
      font-weight: 400;
      color: #c2b495a8;
      letter-spacing: .22em;
      margin-top: 12px;
      transition: color .2s
    }

    .scene-right {
      position: absolute;
      right: 38px;
      top: 34px;
      font: 9px ui-monospace, Consolas, monospace;
      color: #b9b09a5e;
      letter-spacing: .13em;
      z-index: 8
    }

    .scene-caption {
      position: absolute;
      bottom: 34px;
      left: 39px;
      z-index: 8;
      pointer-events: none
    }

    .caption-title {
      font: italic 22px Georgia, "Times New Roman", serif;
      color: #d5c6a36e;
      letter-spacing: .025em
    }

    .caption-sub {
      margin-top: 9px;
      font-size: 9px;
      letter-spacing: .24em;
      color: #9e9f8866
    }

    .scene-number {
      position: absolute;
      right: 38px;
      bottom: 33px;
      color: #b9b09a48;
      font: 10px ui-monospace, Consolas, monospace;
      letter-spacing: .1em;
      z-index: 8
    }

    .hand-wrap {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      will-change: transform, opacity;
      transform-origin: 19.1% 27.9%;
    }

    .hand-frame {
      position: absolute;
      display: block;
      max-width: none;
      user-select: none;
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
      will-change: transform, opacity;
      transform-origin: 50% 58%;
      filter: drop-shadow(14px 22px 14px rgba(0, 0, 0, .48))
    }

    .hand-pre {
      left: 28px;
      top: 0;
      width: 630px;
      height: 1008px
    }

    .hand-snap {
      left: 8px;
      top: 0;
      width: 683px;
      height: 1008px
    }

    .gold-wash {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 37%, #ffe6a13d, transparent 48%);
      opacity: 0;
      mix-blend-mode: screen
    }

    .timeline {
      position: relative;
      background: #111615;
      height: 3px;
      overflow: hidden
    }

    .timeline-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #806640, #eecb78);
      pointer-events: none
    }

    .scrubber {
      position: absolute;
      inset: -9px 0;
      width: 100%;
      height: 21px;
      opacity: 0;
      cursor: ew-resize;
      margin: 0;
      z-index: 10
    }

    .timeline-zone {
      height: 3px;
      position: relative;
      z-index: 10
    }

    .controls {
      min-height: 80px;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: linear-gradient(120deg, #111614, #101312);
      border-top: 1px solid #ffffff04
    }

    .control-left,
    .control-right,
    .speed-group {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .btn {
      border: 1px solid #e4d4a216;
      background: #ffffff03;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      padding: 11px 17px;
      line-height: 1.3;
      white-space: nowrap;
      transition: background .2s, border-color .2s
    }

    .btn:hover {
      background: #e5cf9320;
      border-color: #e4d4a230
    }

    .btn.primary {
      background: #e5c77f;
      color: #211e16;
      border-color: #e5c77f;
      font-weight: 600
    }

    .btn.primary:hover {
      background: #f4db9e
    }

    .btn svg {
      width: 14px;
      height: 14px;
      flex: none
    }

    .btn.icon-only {
      padding: 11px
    }

    .divider {
      height: 20px;
      width: 1px;
      background: var(--line);
      margin: 0 8px
    }

    .small-label {
      color: var(--muted);
      font-size: 11px;
      margin-right: 5px
    }

    .speed-group {
      gap: 3px;
      border: 1px solid #e4d4a211;
      border-radius: 5px;
      padding: 3px;
      background: #080b0b77
    }

    .speed {
      border: 0;
      background: none;
      border-radius: 3px;
      padding: 7px 10px;
      font-size: 11px;
      color: #83877f;
      min-width: 39px
    }

    .speed[aria-pressed="true"] {
      color: #eed599;
      background: #c5a46520
    }

    .loop-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #9ba095;
      white-space: nowrap;
      cursor: pointer
    }

    .loop-label input {
      accent-color: var(--gold);
      width: 13px;
      height: 13px;
      margin: 0
    }

    .time {
      font: 10px ui-monospace, Consolas, monospace;
      color: #939386;
      min-width: 71px;
      text-align: right
    }

    .below {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 2px 0
    }

    .description {
      margin: 0;
      font-size: 11px;
      line-height: 1.9;
      letter-spacing: .055em;
      color: #8c9085
    }

    .description strong {
      font-weight: 400;
      color: #c8b78d
    }

    .tech {
      font: 9px/2 ui-monospace, Consolas, monospace;
      letter-spacing: .13em;
      color: #626960;
      text-align: right
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    @media(min-width:1550px) {
      .app {
        padding-top: 55px
      }

      .masthead {
        margin-bottom: 31px
      }
    }

    @media(max-width:950px) {
      .app {
        width: calc(100% - 40px);
        padding-top: 27px
      }

      .controls {
        padding: 15px;
        gap: 12px
      }

      .control-left,
      .control-right {
        gap: 7px
      }

      .divider {
        margin: 0 3px
      }

      .small-label {
        display: none
      }

      .time {
        display: none
      }

      .btn {
        padding: 10px 13px
      }
    }

    @media(max-width:640px) {
      .app {
        width: calc(100% - 24px);
        padding-top: 22px
      }

      .title {
        font-size: 20px
      }

      .eyebrow {
        font-size: 8px;
        letter-spacing: .19em
      }

      .brand {
        gap: 11px
      }

      .brand-mark {
        width: 35px;
        height: 35px
      }

      .masthead {
        margin-bottom: 20px
      }

      .masthead-note {
        font-size: 9px;
        letter-spacing: 0
      }

      .controls {
        flex-wrap: wrap;
        padding: 13px;
        gap: 14px
      }

      .control-left {
        width: 100%;
        justify-content: space-between
      }

      .control-right {
        width: 100%;
        justify-content: flex-end;
        gap: 14px
      }

      .speed-group {
        margin-left: auto
      }

      .divider {
        display: none
      }

      .btn {
        font-size: 11px
      }

      .frame-corner {
        width: 9px;
        height: 9px
      }

      .tl,
      .bl {
        left: 11px
      }

      .tr,
      .br {
        right: 11px
      }

      .tl,
      .tr {
        top: 11px
      }

      .bl,
      .br {
        bottom: 11px
      }

      .scene-meta {
        left: 21px;
        top: 20px
      }

      .scene-overline {
        font-size: 5px
      }

      .scene-phase {
        font-size: 8px;
        margin-top: 7px
      }

      .scene-right {
        font-size: 6px;
        right: 22px;
        top: 21px
      }

      .scene-caption {
        bottom: 19px;
        left: 21px
      }

      .caption-title {
        font-size: 12px
      }

      .caption-sub {
        font-size: 5px;
        margin-top: 5px
      }

      .scene-number {
        right: 20px;
        bottom: 19px;
        font-size: 7px
      }

      .stage::after {
        box-shadow: inset 0 0 35px 8px #0204057a
      }

      .below {
        display: block;
        padding: 16px 2px 0
      }

      .description {
        font-size: 10px;
        line-height: 1.95
      }

      .tech {
        text-align: left;
        margin-top: 9px;
        font-size: 8px
      }

      .loop-label {
        font-size: 10px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        scroll-behavior: auto !important
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 3L45 24 24 45 3 24Z" stroke="currentColor" stroke-opacity=".48" />
          <circle cx="24" cy="24" r="11" stroke="currentColor" stroke-width=".75" />
          <path d="M12 28c4-18 8-18 12-4s8 14 12-4M24 8v32M8 24h32" stroke="currentColor" stroke-width=".75" />
          <circle cx="24" cy="24" r="2" fill="currentColor" />
        </svg>
        <div>
          <p class="eyebrow">SAGE / MOTION STUDY 001</p>
          <h1 class="title" data-i18n="title"></h1>
        </div>
      </div>
      <div class="masthead-note"><span class="status-light"></span><span data-i18n="realtime"></span></div>
    </header>
    <section class="stage-shell" aria-label="Golden mathematical finger snap animation">
      <div class="stage" id="stage">
        <div class="hand-wrap" id="handWrap" aria-hidden="true">
          <div class="hand-frame hand-pre" id="handPre" style="background-image:url('../sage-snap-1.png')"></div>
          <div class="hand-frame hand-snap" id="handSnap" style="background-image:url('../sage-snap-2.png')"></div>
        </div>
        <canvas class="environment" id="environment" aria-hidden="true"></canvas>
        <div class="floor-glow"></div>
        <canvas class="backfx" id="backfx" aria-hidden="true"></canvas>
        <div class="gold-wash" id="goldWash"></div>
        <canvas class="frontfx" id="frontfx" aria-hidden="true"></canvas>
        <div class="frame-corner tl"></div>
        <div class="frame-corner tr"></div>
        <div class="frame-corner bl"></div>
        <div class="frame-corner br"></div>
        <div class="scene-meta">
          <div class="scene-overline">FIELD NOTES / 001</div>
          <div class="scene-phase" id="phase"></div>
        </div>
        <div class="scene-right">X &#8712; &#8477; &nbsp; / &nbsp; 16:9</div>
        <div class="scene-caption">
          <div class="caption-title">A snap. An answer.</div>
          <div class="caption-sub" data-i18n="caption"></div>
        </div>
        <div class="scene-number" id="sceneNumber">t + 0.000</div>
      </div>
      <div class="timeline-zone">
        <div class="timeline">
          <div class="timeline-fill" id="progress"></div>
        </div><input class="scrubber" id="scrubber" type="range" min="0" max="6.8" step="0.001" value="0"
          aria-label="Animation timeline">
      </div>
      <div class="controls">
        <div class="control-left">
          <button class="btn primary" id="replay"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4.4 6a6.5 6.5 0 1 1-1 6M4.5 2v4.5H9" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg><span data-i18n="replay"></span></button>
          <button class="btn" id="playPause"><svg id="playIcon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M7 5v10M13 5v10" stroke="currentColor" stroke-width="2" />
            </svg><span id="playLabel"></span></button>
          <div class="divider"></div><span class="small-label" data-i18n="speed"></span>
          <div class="speed-group" role="group" aria-label="Playback speed"><button class="speed" data-speed="0.5"
              aria-pressed="false">0.5&#215;</button><button class="speed" data-speed="1"
              aria-pressed="true">1&#215;</button><button class="speed" data-speed="1.5"
              aria-pressed="false">1.5&#215;</button></div>
        </div>
        <div class="control-right">
          <label class="loop-label"><input id="loop" type="checkbox" checked><span data-i18n="loop"></span></label>
          <button class="btn icon-only" id="sound" aria-label="Enable finger snap sound" aria-pressed="false"><svg
              viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M3 8h3l4-3v10l-4-3H3V8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
              <path id="soundWaves" d="m13 8 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" />
            </svg></button>
          <button class="btn icon-only" id="fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 20 20" fill="none"
              aria-hidden="true">
              <path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg></button>
          <span class="time" id="time">00.00 / 06.80</span>
        </div>
      </div>
    </section>
    <footer class="below">
      <p class="description" id="description"></p>
      <div class="tech">DIV HAND FRAMES + CANVAS TRAJECTORIES<br>SELF-CONTAINED / NO EXTERNAL ASSETS</div>
    </footer>
  </main>
  <script>
    'use strict';
    /*
     * GOLDEN SNAP - standalone, offline animation study.
     * Public API: window.GoldenSnap.play(), pause(), restart(), seek(seconds),
     *             setSpeed(rate), setLoop(boolean), getState().
     * Timing and visual density can be changed in CONFIG below.
     * Hand artwork is embedded as PNG backgrounds on two div frames.
     * No external assets, network requests or build step required.
     */
    const I18N = { title: '\u5f48\u6307\u30fb\u6f14\u7b97', realtime: '\u5373\u6642\u52d5\u756b\u7fd2\u4f5c', caption: '\u4e00\u500b\u52d5\u4f5c\uff0c\u5c55\u958b\u7121\u6578\u89e3\u7b54\u3002', replay: '\u91cd\u64ad\u52d5\u756b', pause: '\u66ab\u505c', play: '\u64ad\u653e', speed: '\u64ad\u653e\u901f\u5ea6', loop: '\u5faa\u74b0\u64ad\u653e', ready: '01 / \u5047\u8a2d', hold: '02 / \u84c4\u52e2', snap: '03 / \u6c42\u89e3', echo: '04 / \u9918\u97fb', wait: '00 / \u975c\u9ed8', soundOn: '\u95dc\u9589\u5f48\u6307\u97f3\u6548', soundOff: '\u958b\u555f\u5f48\u6307\u97f3\u6548', fullscreen: '\u5168\u87a2\u5e55', exitFullscreen: '\u96e2\u958b\u5168\u87a2\u5e55' };
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = I18N[el.dataset.i18n]);
    document.title = I18N.title + ' | Golden Snap';
    document.getElementById('description').innerHTML = '<strong>\u53f3\u624b\u62ac\u8d77\u3001\u84c4\u52e2\u3001\u5f48\u6307\u3002</strong>\u6307\u5c16\u91cb\u653e\u91d1\u8272\u66f2\u7dda\uff0c\u624b\u5fae\u5fae\u4e0b\u58d3\u5f8c\u6d88\u5931\u3002<br>\u62d6\u66f3\u756b\u9762\u4e0b\u65b9\u7684\u91d1\u8272\u9032\u5ea6\u5217\u53ef\u6aa2\u8996\u52d5\u4f5c\uff1b\u4f7f\u7528 0.5\u00d7 \u89c0\u5bdf\u5f48\u6307\u77ac\u9593\u3002';
    const CONFIG = Object.freeze({ width: 1440, height: 810, duration: 6.8, snapAt: 2.12, handFadeStart: 2.47, handFadeEnd: 3.10, originX: 720, originY: 304, handScale: .56, curveCount: 31, sparkCount: 105, maxDpr: 2 });
    const HAND_LAYOUT = Object.freeze({ width: 760, height: 1020, anchorX: 145, anchorY: 285 });
    const $ = id => document.getElementById(id);
    const stage = $('stage'), hand = $('handWrap'), handPre = $('handPre'), handSnap = $('handSnap'), back = $('backfx'), front = $('frontfx'), env = $('environment');
    const b = back.getContext('2d'), f = front.getContext('2d'), e = env.getContext('2d');
    if (!b || !f || !e) throw new Error('This animation requires Canvas 2D support.');
    const clamp = (v, a = 0, z = 1) => Math.max(a, Math.min(z, v));
    const lerp = (a, z, t) => a + (z - a) * t;
    const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t) };
    const out3 = t => 1 - Math.pow(1 - clamp(t), 3);
    const out5 = t => 1 - Math.pow(1 - clamp(t), 5);
    const between = (t, a, z) => clamp((t - a) / (z - a));
    const TAU = Math.PI * 2;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let t = reduced ? 1.5 : 0, playing = !reduced, speed = 1, loop = true, soundEnabled = false, last = 0, raf = 0, manual = false;
    let audio = null, view = { scale: 1, offsetX: 0, offsetY: 0, width: 1440, height: 810, dpr: 1 };
    let seed = 103;
